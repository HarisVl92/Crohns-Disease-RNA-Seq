name: rnaseq
# Conda environment for the shell steps (01-05) and the Python steps (07, 09).
#   create:   conda env create -f environment.yml
#   activate: conda activate rnaseq
#   lock:     conda env export -n rnaseq > environment.lock.yml
# The R steps (06, 08) run on R 4.3 with Bioconductor packages (see README).
# The environment is shared with other training projects, so it also contains
# tools that this pipeline does not use (bowtie2, bwa, bcftools, bedtools, blast).
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- QC & trimming ---
  - fastqc
  - multiqc
  - trim-galore
  - cutadapt
  - trimmomatic
  # --- alignment ---
  - hisat2
  - bowtie2
  - bwa
  # --- SAM/BAM & variant utilities ---
  - samtools
  - bcftools
  - bedtools
  # --- quantification ---
  - subread          # provides featureCounts
  # --- downstream / workflow / data access ---
  - blast
  - snakemake-minimal
  - sra-tools
  # --- Python steps (07_enrichr.py, 09_qc_summary.py) ---
  - python>=3.10
  - pandas
  - matplotlib
  - requests
